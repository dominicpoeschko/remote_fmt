name: CI

on:
    workflow_dispatch:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        container:
            image: archlinux:latest
        # Release is the only build type that defines NDEBUG, and it is the default, so without the
        # two Debug entries every job here compiles the asserts out and none of them can ever fire.
        # They mirror the sanitizer entries so the deepest-checking configurations carry them.
        strategy:
            fail-fast: false
            matrix:
                compiler:
                    - {cc: gcc, cxx: g++}
                    - {cc: gcc, cxx: g++, stdlib_debug: true, sanitizer: address}
                    - {cc: clang, cxx: clang++}
                    - {cc: clang, cxx: clang++, stdlib: libc++, stdlib_debug: true, sanitizer: address}
                    - {cc: gcc, cxx: g++, build_type: Debug, stdlib_debug: true, sanitizer: address}
                    - {
                        cc: clang,
                        cxx: clang++,
                        build_type: Debug,
                        stdlib: libc++,
                        stdlib_debug: true,
                        sanitizer: address,
                      }

        steps:
            - name: Set up C++ environment
              run: |
                pacman -Syu --noconfirm --disable-download-timeout
                pacman -S --noconfirm --disable-download-timeout git cmake base-devel ${{ matrix.compiler.cc == 'clang' && 'clang' || '' }} ${{ matrix.compiler.stdlib == 'libc++' && 'libc++ lld' || '' }}

            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                submodules: recursive

            - name: Configure CMake
              run: >
                cmake -S tests -B build
                -DUSE_FORCE_FETCH=ON
                ${{ matrix.compiler.build_type && format('-DCMAKE_BUILD_TYPE={0}', matrix.compiler.build_type) || '' }}
                ${{ matrix.compiler.sanitizer && format('-DUSE_SANITIZER={0}', matrix.compiler.sanitizer) || '' }}
                ${{ matrix.compiler.stdlib && format('-DUSE_STD_LIB={0}', matrix.compiler.stdlib) || '' }}
                ${{ matrix.compiler.stdlib_debug && '-DUSE_STDLIB_DEBUG=true' || '' }}
              env:
                CC: ${{ matrix.compiler.cc }}
                CXX: ${{ matrix.compiler.cxx }}

            - name: Build project
              run: cmake --build build -j"$(nproc)"

            - name: Run tests
              run: cd build && ctest --output-on-failure

    # The examples are the documentation, so they have to keep compiling against the tree rather than
    # only against whatever is on master. They assert their own results, so they are run as well as
    # built - which also covers the catalog generator end to end, python and nm included.
    examples:
        runs-on: ubuntu-latest
        container:
            image: archlinux:latest
        strategy:
            fail-fast: false
            matrix:
                compiler:
                    - {cc: gcc, cxx: g++}
                    - {cc: clang, cxx: clang++}

        steps:
            - name: Set up C++ environment
              run: |
                pacman -Syu --noconfirm --disable-download-timeout
                pacman -S --noconfirm --disable-download-timeout git cmake base-devel python ${{ matrix.compiler.cc == 'clang' && 'clang' || '' }}

            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                submodules: recursive

            - name: Configure CMake
              run: cmake -S examples -B build_examples -DUSE_FORCE_FETCH=ON
              env:
                CC: ${{ matrix.compiler.cc }}
                CXX: ${{ matrix.compiler.cxx }}

            - name: Build examples
              run: cmake --build build_examples -j"$(nproc)"

            # catalog_generator reads the catalog json that the build wrote next to it, so run from
            # the build directory.
            - name: Run examples
              working-directory: build_examples
              run: |
                ./basic
                ./catalog
                ./catalog_generator

    # Dedicated longer libFuzzer runs. Uses clang; the fuzz targets build for gcc
    # automatically once gcc supports -fsanitize=fuzzer.
    #
    # Both build types: Release is what ships, Debug is the only one where the parser's asserts
    # exist at all. They also differ in codegen, so a sanitizer report from one is not guaranteed
    # from the other. Measured execution rates are within 5% and the entries run in parallel.
    fuzz:
        runs-on: ubuntu-latest
        container:
            image: archlinux:latest
        strategy:
            fail-fast: false
            matrix:
                build_type: [Release, Debug]

        steps:
            - name: Set up C++ environment
              run: |
                pacman -Syu --noconfirm --disable-download-timeout
                pacman -S --noconfirm --disable-download-timeout git cmake base-devel clang

            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                submodules: recursive

            - name: Configure CMake
              run: cmake -S tests -B build -DUSE_FORCE_FETCH=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
              env:
                CC: clang
                CXX: clang++

            - name: Build fuzz targets
              run: cmake --build build -j"$(nproc)" --target fuzz_parser fuzz_roundtrip fuzz_corpus_generator

            - name: Generate seed corpus
              run: ./build/fuzz_corpus_generator build/corpus

            # build/corpus_committed is the committed corpus, unpacked from tests/corpus.tar.xz
            # by the CMake configure step. Starting from it rather than from the generated
            # seeds is the difference between ~540 and ~3900 edges at INITED, so the whole
            # 300s goes on new ground instead of re-deriving what the last run already found.
            # Only build/corpus is writable; libFuzzer treats the extra directories as
            # read-only.
            #
            # -max_len must stay at least as large as the biggest seed: a limit below a seed does
            # not skip it, it truncates it, which would silently defang
            # corpus_regressions/parser-nesting-stack-overflow (~16kB is needed to overflow).
            # Absent the flag libFuzzer derives the limit from the largest corpus file, so pinning
            # it keeps the ceiling off whatever the corpus happens to contain. Costs ~8% of the rate.
            - name: Run parser fuzzer
              run: >
                ./build/fuzz_parser -max_total_time=300 -print_final_stats=1
                -max_len=65536
                -dict=tests/fuzz_parser.dict
                build/corpus build/corpus_committed tests/corpus_regressions

            # Round-trip fuzzer: builds its own messages through Printer, so it needs no
            # seed corpus. Compares against fmt, so it fails on silent encode/decode
            # disagreements and not just on crashes.
            - name: Run round-trip fuzzer
              run: >
                ./build/fuzz_roundtrip -max_total_time=300 -print_final_stats=1
                build/corpus_roundtrip

            # JS actions cannot run in the bare archlinux container under act (no node),
            # so skip the upload there - crash files still land in the act workdir.
            - name: Upload crash artifacts
              if: failure() && !env.ACT
              uses: actions/upload-artifact@v4
              with:
                # Per build type: upload-artifact@v4 rejects a name another job already uploaded.
                name: fuzz-crashes-${{ matrix.build_type }}
                path: |
                  crash-*
                  leak-*
                  timeout-*
                  oom-*
                if-no-files-found: ignore
